<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AutoClear — מסביר טופס בדיקת רכב</title>
<meta name="description" content="AutoClear — מסביר בשפה פשוטה את טופס הבדיקה של רכב לפני קנייה. הסבר בלבד, לא חוות דעת מקצועית.">
<meta name="theme-color" content="#0d0d0d" id="tc-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoClear">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --bg2:#131315; --bg3:#1b1b1e; --bg4:#242428;
  --border:#2c2c31; --border2:#3d3d44;
  --text:#ececed; --text2:#9b9ba3; --text3:#5f5f68;
  --accent:#c9a84c; --accent2:#8a6d2f; --accent-bg:#1c1607; --accent-txt:#0b0b0d;
  --ok:#4caf72; --ok-bg:#0d2016;
  --warn:#d9a441; --warn-bg:#231a08;
  --bad:#cf4a4a; --bad-bg:#230d0d;
  --info:#5b9bd5; --info-bg:#0b1622;
  --font:'Rubik',system-ui,sans-serif;
  --r:10px; --r-lg:16px;
  --shadow:0 6px 28px rgba(0,0,0,.55);
}
[data-theme="blue"]{--accent:#5b9bd5;--accent2:#356b9c;--accent-bg:#0b1622;--accent-txt:#04101a}
[data-theme="green"]{--accent:#4caf72;--accent2:#2e7048;--accent-bg:#0d2016;--accent-txt:#04140b}
[data-theme="purple"]{--accent:#a184e0;--accent2:#6b4fa8;--accent-bg:#150e24;--accent-txt:#0a0614}
[data-theme="red"]{--accent:#d4695b;--accent2:#984238;--accent-bg:#210e0b;--accent-txt:#160604}

body.light{
  --bg:#f4f2ee; --bg2:#ffffff; --bg3:#f0ece4; --bg4:#e6e0d4;
  --border:#dcd6c9; --border2:#c3bcab;
  --text:#1c1a16; --text2:#5e594e; --text3:#948d7d;
  --accent-bg:#faf3dd; --accent-txt:#ffffff;
  --ok-bg:#e6f4ec; --warn-bg:#fdf3e0; --bad-bg:#fbe9e9; --info-bg:#e8f1fa;
  --shadow:0 6px 28px rgba(0,0,0,.10);
}
body.light[data-theme="gold"]{--accent:#9a7c25;--accent2:#6d5717}
body.light[data-theme="blue"]{--accent:#2f6ea8}
body.light[data-theme="green"]{--accent:#2e7048}
body.light[data-theme="purple"]{--accent:#6b4fa8}
body.light[data-theme="red"]{--accent:#a9463a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.6;min-height:100vh;
  transition:background .18s,color .18s;
  padding-bottom:env(safe-area-inset-bottom);
}
body[lang="ar"]{font-family:'Noto Sans Arabic','Rubik',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px;color:var(--accent);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:10px;color:var(--text3);font-weight:400;letter-spacing:0}
.ai-led{width:9px;height:9px;border-radius:50%;background:var(--text3);flex:0 0 auto;
  margin-inline-end:2px;box-shadow:0 0 0 0 transparent;transition:background .2s}
.ai-led.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg2);display:flex;align-items:center;justify-content:center;
  font-size:16px;flex:0 0 auto;transition:border-color .15s
}
.icon-btn:hover{border-color:var(--accent)}

/* ---------- generic ---------- */
.screen{display:none;animation:fade .22s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2.title{font-size:21px;font-weight:700;margin:18px 0 4px}
p.sub{color:var(--text2);font-size:13px;margin:0 0 16px}

.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:12px
}
.card.tight{padding:12px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 16px;border-radius:var(--r);font-weight:600;font-size:15px;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
  transition:transform .1s,border-color .15s,background .15s
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--accent-txt);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-row .btn{width:auto;flex:1 1 130px}

.home-btn{
  display:flex;align-items:center;gap:14px;width:100%;text-align:start;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:10px;transition:border-color .15s,transform .1s
}
.home-btn:hover{border-color:var(--accent)}
.home-btn:active{transform:scale(.99)}
.home-btn .em{font-size:26px;flex:0 0 auto;width:44px;height:44px;border-radius:12px;
  background:var(--accent-bg);display:flex;align-items:center;justify-content:center}
.home-btn .tx{flex:1;min-width:0}
.home-btn .tx b{display:block;font-size:16px;font-weight:600}
.home-btn .tx span{display:block;font-size:12px;color:var(--text2);line-height:1.45}
.home-btn .ar{color:var(--text3);font-size:18px}

.back-btn{
  display:flex;align-items:center;gap:8px;width:100%;justify-content:center;
  padding:14px;margin:22px 0 8px;border-radius:var(--r);
  border:1px solid var(--accent);color:var(--accent);background:transparent;
  font-weight:600;font-size:15px
}

label.fld{display:block;font-size:12px;color:var(--text2);margin:12px 0 5px;font-weight:500}
input.in,select.in,textarea.in{
  width:100%;padding:12px 13px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none
}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
textarea.in{min-height:96px;resize:vertical;line-height:1.6}
.hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;border:1px solid var(--border2);background:var(--bg3);color:var(--text2)
}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.chip.acc{background:var(--accent-bg);color:var(--accent);border-color:var(--accent2)}

.note{
  border-radius:var(--r);padding:11px 13px;font-size:12.5px;line-height:1.6;
  border:1px solid var(--border);background:var(--bg3);margin:10px 0
}
.note.warn{background:var(--warn-bg);border-color:var(--warn)}
.note.bad{background:var(--bad-bg);border-color:var(--bad)}
.note.info{background:var(--info-bg);border-color:var(--info)}
.note b{color:var(--text)}

.disc{
  font-size:10.5px;color:var(--text3);line-height:1.5;
  border-inline-start:2px solid var(--border2);padding-inline-start:8px;margin-top:8px
}

.sect-lbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1.2px;
  text-transform:uppercase;margin:22px 0 8px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--text2);flex:0 0 auto}
.kv b{font-weight:600;text-align:end;word-break:break-word}

/* form rows */
.row{
  display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)
}
.row .num{font-size:11px;color:var(--text3);width:20px;flex:0 0 auto;padding-top:3px;font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0;font-size:14px;font-weight:500}
.row .st{display:flex;gap:5px;flex:0 0 auto}
.st-btn{width:34px;height:32px;border-radius:8px;border:1px solid var(--border2);
  background:var(--bg3);font-size:14px;display:flex;align-items:center;justify-content:center}
.st-btn.sel-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.st-btn.sel-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.row-note{width:100%;margin-top:7px}

/* dictionary */
.dict-item{border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;background:var(--bg2)}
.dict-head{width:100%;display:flex;align-items:center;gap:9px;padding:13px;text-align:start}
.dict-head b{flex:1;font-size:14px;font-weight:600}
.dict-body{padding:0 13px 14px;font-size:13px;line-height:1.7;color:var(--text2);display:none}
.dict-item.open .dict-body{display:block}
.dict-body h5{margin:12px 0 3px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text3)}
.dict-body p{margin:0}
.dict-body ul{margin:4px 0 0;padding-inline-start:18px}
.dict-body li{margin-bottom:3px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:none;
  align-items:flex-end;justify-content:center;padding:0}
.ovl.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--border);border-bottom:none;
  border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:760px;max-height:92vh;
  overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);
  animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet-x{position:sticky;top:-18px;float:inline-end;font-size:22px;color:var(--text3);
  background:var(--bg2);padding:0 4px}

/* provider picker */
.prov{border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:8px;
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:start;background:var(--bg3)}
.prov.sel{border-color:var(--accent);background:var(--accent-bg)}
.prov .pi{font-size:21px}
.prov .pt{flex:1;min-width:0}
.prov .pt b{display:block;font-size:14px}
.prov .pt span{display:block;font-size:11.5px;color:var(--text2);line-height:1.5}
.prov-area{display:none;padding:12px;border:1px dashed var(--border2);border-radius:var(--r);
  margin:-4px 0 10px;background:var(--bg3)}
.prov-area.on{display:block}
.prov-area ol{margin:8px 0 0;padding-inline-start:20px;font-size:12px;color:var(--text2);line-height:1.8}

.shots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.shot{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--border2)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:2px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}

/* toast */
#toast{position:fixed;bottom:26px;inset-inline:0;margin:auto;width:max-content;max-width:88%;
  background:var(--bg4);border:1px solid var(--accent);color:var(--text);
  padding:11px 18px;border-radius:999px;font-size:13px;z-index:120;opacity:0;
  pointer-events:none;transition:opacity .22s,transform .22s;transform:translateY(10px);text-align:center}
#toast.on{opacity:1;transform:none}

.srcbox{margin-top:10px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--bg3)}
.srchd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--border);background:var(--bg4)}
.srcrow{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border);align-items:flex-start}
.srcrow:last-of-type{border-bottom:none}
.srctag{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--text2);min-width:78px;padding-top:1px}
.srctx{flex:1;min-width:0;font-size:12.5px;line-height:1.6;color:var(--text)}
.srcbox .disc{padding:8px 11px;margin:0;border-top:1px solid var(--border);border-inline-start:none}

.spin{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

.foot{text-align:center;padding:26px 0 10px;font-size:11px;color:var(--text3);line-height:1.9}
.foot a{color:var(--accent);text-decoration:none}

@media print{
  .topbar,.back-btn,.btn,.btn-row,.icon-btn,.foot,#toast,.ovl{display:none!important}
  body{background:#fff;color:#000}
  .card{border:1px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body data-theme="gold" lang="he">
<div class="topbar">
  <div class="topbar-in">
    <div class="brand" id="brandTx">AutoClear<small id="brandSub">מסביר טופס בדיקת רכב</small></div>
    <span class="ai-led" id="aiLed" title="AI"></span>
    <button class="icon-btn" id="btnTheme" title="ערכת צבע">🎨</button>
    <button class="icon-btn" id="btnMode" title="יום/לילה">🌙</button>
    <button class="icon-btn" id="btnLang" title="שפה">🌐</button>
  </div>
</div>

<div class="wrap">

<!-- ======== GATE ======== -->
<div class="screen on" id="s-gate">
  <h2 class="title" id="g-h">לפני שמתחילים</h2>
  <p class="sub" id="g-s">חשוב שתקרא את זה. זה לוקח חצי דקה.</p>
  <div class="card">
    <div class="note bad" id="g-1"></div>
    <div class="note warn" id="g-2"></div>
    <div class="note" id="g-3"></div>
    <div class="note info" id="g-4"></div>
    <label style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;cursor:pointer">
      <input type="checkbox" id="g-ck" style="width:20px;height:20px;flex:0 0 auto;margin-top:2px;accent-color:var(--accent)">
      <span style="font-size:13.5px;line-height:1.6" id="g-ckt"></span>
    </label>
    <button class="btn primary" id="g-go" disabled style="margin-top:14px"></button>
  </div>
</div>

<!-- ======== HOME ======== -->
<div class="screen" id="s-home">
  <h2 class="title" id="h-h"></h2>
  <p class="sub" id="h-s"></p>
  <button class="home-btn" data-go="scan"><span class="em">📷</span><span class="tx"><b id="h-b0"></b><span id="h-t0"></span></span><span class="ar">›</span></button>
  <button class="home-btn" data-go="form"><span class="em">📋</span><span class="tx"><b id="h-b1"></b><span id="h-t1"></span></span><span class="ar">›</span></button>
  <button class="home-btn" data-go="dict"><span class="em">📖</span><span class="tx"><b id="h-b2"></b><span id="h-t2"></span></span><span class="ar">›</span></button>
  <button class="home-btn" data-go="plate"><span class="em">🔎</span><span class="tx"><b id="h-b3"></b><span id="h-t3"></span></span><span class="ar">›</span></button>
  <button class="home-btn" data-go="ai"><span class="em">🤖</span><span class="tx"><b id="h-b4"></b><span id="h-t4"></span></span><span class="ar">›</span></button>
  <button class="home-btn" data-go="set"><span class="em">⚙️</span><span class="tx"><b id="h-b5"></b><span id="h-t5"></span></span><span class="ar">›</span></button>
  <div class="note" id="h-note" style="margin-top:16px"></div>
  <div class="foot">
    <span id="f-ver"></span><br>
    <a href="#" id="f-guide"></a> · <a href="#" id="f-about"></a> · <a href="#" id="f-priv"></a><br>
    <span style="color:var(--accent)">AppNest</span> · Barak Aflalo · © 2026
  </div>
</div>


<!-- ======== SCAN ======== -->
<div class="screen" id="s-scan">
  <h2 class="title" id="sc-h"></h2>
  <p class="sub" id="sc-s"></p>

  <div class="note info" id="sc-need" style="display:none"></div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span class="chip acc">1</span><b id="sc-l1"></b>
    </div>
    <div class="hint" id="sc-d1"></div>
    <div class="shots" id="sc-lic-thumbs"></div>
    <input type="file" id="sc-lic" accept="image/*" capture="environment" hidden>
    <button class="btn" onclick="document.getElementById('sc-lic').click()">📷 <span id="sc-b1"></span></button>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span class="chip acc">2</span><b id="sc-l2"></b>
    </div>
    <div class="hint" id="sc-d2"></div>
    <div class="shots" id="sc-frm-thumbs"></div>
    <input type="file" id="sc-frm" accept="image/*" capture="environment" multiple hidden>
    <button class="btn" onclick="document.getElementById('sc-frm').click()">📷 <span id="sc-b2"></span></button>
  </div>

  <button class="btn primary" id="sc-go" style="margin-top:6px"></button>
  <div id="sc-prog"></div>
  <div class="note" id="sc-priv" style="font-size:11.5px"></div>
  <button class="back-btn" data-go="home">‹ <span class="bk"></span></button>
</div>

<!-- ======== REVIEW ======== -->
<div class="screen" id="s-rev">
  <h2 class="title" id="rv-h"></h2>
  <p class="sub" id="rv-s"></p>
  <div id="rv-body"></div>
  <button class="btn primary" id="rv-go" style="margin-top:14px"></button>
  <button class="btn" id="rv-edit" style="margin-top:8px"></button>
  <button class="back-btn" data-go="scan">‹ <span id="rv-bk"></span></button>
</div>

<!-- ======== FORM ======== -->
<div class="screen" id="s-form">
  <h2 class="title" id="fm-h"></h2>
  <p class="sub" id="fm-s"></p>

  <div class="card tight">
    <label class="fld" id="fm-l0"></label>
    <select class="in" id="fm-type">
      <option value="basic">נספח 2 — בדיקה כללית ללא מערכות ממוחשבות (21 סעיפים)</option>
      <option value="full">נספח 1 — בדיקה מלאה כולל מערכות ממוחשבות (25 סעיפים)</option>
    </select>
    <div class="hint" id="fm-h0"></div>
  </div>

  <div class="card tight">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div style="flex:1 1 120px"><label class="fld" id="fm-lp"></label>
        <input class="in" id="fm-plate" inputmode="numeric" placeholder="12-345-67"></div>
      <div style="flex:1 1 120px"><label class="fld" id="fm-lk"></label>
        <input class="in" id="fm-km" inputmode="numeric" placeholder="47396"></div>
    </div>
    <label class="fld" id="fm-lc"></label>
    <input class="in" id="fm-inst" placeholder="">
  </div>

  <div class="sect-lbl" id="fm-rows"></div>
  <div class="card tight" id="fm-list"></div>

  <button class="btn primary" id="fm-run" style="margin-top:14px"></button>
  <div class="hint" id="fm-cnt" style="text-align:center"></div>
  <button class="back-btn" data-go="home">‹ <span class="bk"></span></button>
</div>

<!-- ======== RESULT ======== -->
<div class="screen" id="s-res">

function formDef(){return S.f.type==="full"?FORM_FULL:FORM_BASIC}
function poolFor(row){
  if(row.src==="CHASSIS"){
    const c=D.chassis.body;
    return [].concat(c.high.map(x=>["high",x]),c.low.map(x=>["low",x]),c.minor.map(x=>["minor",x]));
  }
  const src=D[row.src];
  let list=[];
  if(Array.isArray(src))list=src.slice();
  else if(src&&typeof src==="object")Object.keys(src).forEach(g=>{src[g].forEach(x=>list.push(x))});
  if(row.also&&Array.isArray(D[row.also]))list=list.concat(D[row.also]);
  return list.map(x=>[row.src,x]);
}
function renderForm(){
  document.getElementById("fm-type").value=S.f.type;

function pickDiag(n){
  const row=formDef().find(r=>r.n===n), pool=poolFor(row);

  const d=S.f.rows[window._n]||{st:"bad",diag:[],note:""};

const SEV_ORDER=["safety","high","med","low","info"];
const SEV_CLS={safety:"bad",high:"bad",med:"warn",low:"info",info:"info"};
const SEV_KEY={safety:"sevSafety",high:"sevHigh",med:"sevMed",low:"sevLow",info:"sevInfo"};

function explainOne(cat,name){
  if(cat==="slang"&&SLANG[name])
    return{name,sev:SLANG[name].sev,cost:0,he:SLANG[name].he,ask:[],amb:"",src:"slang"};
  const e=EXPL[name];
  if(e)return{name,sev:e.sev,cost:e.cost,he:e.he,ask:e.ask||[],amb:e.amb||"",src:"dict"};
  if(cat==="high"||cat==="low"||cat==="minor"){
    const m={high:"high",low:"med",minor:"low"}[cat];
    const txt={high:"פגיעה בחלק מבני של הרכב — חלק שנושא עומס. הטופס מסווג את זה כמשמעות גבוהה, וזה משפיע מהותית על השווי ועל הבטיחות.",
      low:"פגיעה בחלק שאינו מבני — לרוב חלק שמתפרק בברגים או פח חיצוני. הטופס מסווג את זה כמשמעות נמוכה.",
      minor:"ליקוי קל במרכב או בפנים הרכב. לא משפיע על מבנה או בטיחות."}[cat];
    return{name,sev:m,cost:cat==="high"?4:(cat==="low"?3:1),he:txt,ask:CAT.chassis.ask,amb:"",src:"chassis"};
  }
  const c=CAT[cat]||CAT.remarks;
  return{name,sev:c.sev,cost:c.cost,he:c.he,ask:c.ask||[],amb:"",src:"cat"};
}
function analyze(){
  const def=formDef(), out=[], asks=new Set(), ambs=[];
  let okN=0,badN=0;
  def.forEach(r=>{
    const d=S.f.rows[r.n]; if(!d||!d.st)return;
    if(d.st==="ok"){okN++;return}
    badN++;
    const items=(d.diag||[]).map(x=>{
      const e=explainOne(x[0],x[1]);
      if(x[2]&&norm(x[2])!==norm(x[1]))e.raw=x[2];
      return e});
    /* סריקת ההערה החופשית אחרי מונחי סלנג */
    const scanText=d.rest!==undefined?d.rest:(d.note||"");
    const notes=[];
    Object.keys(SLANG).forEach(k=>{
      if(scanText.includes(k))notes.push({name:k,sev:SLANG[k].sev,cost:0,he:SLANG[k].he,ask:[],amb:"",src:"slang"})});
    const seen=new Set(), all=items.concat(notes).filter(i=>{
      if(seen.has(i.name))return false; seen.add(i.name); return true});
    if(!all.length)all.push(explainOne(r.src==="CHASSIS"?"chassis":r.src,r.t));
    all.forEach(i=>{
      (i.ask||[]).forEach(a=>asks.add(a));
      if(i.amb)ambs.push({n:i.name,t:i.amb});
    });
    out.push({row:r,note:d.note||"",items:all});
  });
  return{out,asks:[...asks],ambs,okN,badN,
    safetyN:out.reduce((a,b)=>a+b.items.filter(i=>i.sev==="safety").length,0)};
}

function parseJSONArr(t){

  return JSON.parse(s.slice(i,j+1));
}

async function aiCall(prompt){
  const a=S.ai;
  if(!a.provider)throw new Error("no provider");
  if(a.provider==="claude"){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:a.model||"claude-sonnet-4-6",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return (d.content&&d.content[0]&&d.content[0].text)||"";
  }
  if(a.provider==="gemini"){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+(a.model||"gemini-2.5-flash")+":generateContent?key="+a.key,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.3,maxOutputTokens:1200}})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return d?.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }
  const url=a.url||"https://api.openai.com/v1/chat/completions";
  const h={"Content-Type":"application/json"}; if(a.key)h.Authorization="Bearer "+a.key;
  const r=await fetch(url,{method:"POST",headers:h,
    body:JSON.stringify({model:a.model||"gpt-4o-mini",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();return d?.choices?.[0]?.message?.content||"";
}

function fileToImg(file,maxDim){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error("decode"));
      im.onload=()=>{
        let{width:w,height:h}=im, m=maxDim||1600;
        if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        res(c.toDataURL("image/jpeg",.82));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

const VISION_OK=["claude","gemini","openai","custom"];
async function aiVision(images,prompt){
  const a=S.ai;
  if(!a.provider||VISION_OK.indexOf(a.provider)<0)throw new Error(T("needVision"));
  if(a.provider==="claude"){
    const content=images.map(d=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64(d)}}));

      headers:{"Content-Type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:a.model||"claude-sonnet-4-6",max_tokens:4000,messages:[{role:"user",content}]})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return (d.content&&d.content[0]&&d.content[0].text)||"";
  }
  if(a.provider==="gemini"){
    const parts=images.map(d=>({inline_data:{mime_type:"image/jpeg",data:b64(d)}}));
    parts.push({text:prompt});
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+
      (a.model||"gemini-2.5-flash")+":generateContent?key="+a.key,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0,maxOutputTokens:4000}})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return d?.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }
  const content=images.map(d=>({type:"image_url",image_url:{url:d}}));
  content.push({type:"text",text:prompt});
  const url=a.url||"https://api.openai.com/v1/chat/completions";
  const h={"Content-Type":"application/json"}; if(a.key)h.Authorization="Bearer "+a.key;
  const r=await fetch(url,{method:"POST",headers:h,
    body:JSON.stringify({model:a.model||"gpt-4o-mini",max_tokens:4000,messages:[{role:"user",content}]})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();return d?.choices?.[0]?.message?.content||"";
}
function parseJSON(t){
  let s=String(t).trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
  const i=s.indexOf("{"), j=s.lastIndexOf("}");
  if(i<0||j<0)throw new Error("bad json");
  return JSON.parse(s.slice(i,j+1));
}

/* ---------- התאמת טקסט חופשי לרשימה הסגורה של נספח 5 ---------- */
function norm(s){return String(s||"").replace(/[״"׳'.,()\/\-–]/g," ").replace(/\s+/g," ").trim()}
function matchDiag(text,pool,mult){
  const t=norm(text); if(!t)return null;
  const words=t.split(" ").filter(w=>w.length>2);
  let best=null,bs=0;
  pool.forEach(p=>{
    const n=norm(p[1]); let sc=0;
    if(n===t)sc=999;
    else{
      words.forEach(w=>{
        if(n.includes(w))sc+=w.length>=4?3:2;
        else{const st=w.slice(0,Math.max(3,w.length-2));if(st.length>=3&&n.includes(st))sc+=1}
      });
      const nw=n.split(" ").filter(w=>w.length>2);
      nw.forEach(w=>{if(t.includes(w))sc+=1});
    }
    if(sc>bs){bs=sc;best=p}
  });
  const need=Math.max(3,Math.min(6,words.length*2))*(mult||1);
  return bs>=need?{p:best,score:bs,exact:bs>=999}:null;
}

function same(a,b){
  a=norm(a).toLowerCase();b=norm(b).toLowerCase();
  if(!a||!b)return null;                       // אין מה להשוות
  if(a===b)return true;
  const da=a.replace(/\D/g,""),db=b.replace(/\D/g,"");
  if(da&&db&&da===db)return true;
  return a.includes(b)||b.includes(a)?true:false;
}
function crossCheck(lic,mo){
  const rows=[];
  CMP.forEach(c=>{
    const l=lic[c.k], m=c.mo(mo);
    const r=same(l,m);
    rows.push({lb:c.lb[S.lang==="he"?"he":"en"],lic:l||"—",mot:m||"—",
      ok:r,lv:c.lv,why:c.why[S.lang==="he"?"he":"en"]});
  });
  return rows;
}

      S.f.inst=raw.institute||S.f.inst;

        const row=def.find(x=>x.n===Number(r.n)); if(!row)return;
        const rec={st:r.status==="bad"?"bad":(r.status==="ok"?"ok":""),diag:[],note:r.text||"",rest:""};
        const rest=[];
        if(rec.st==="bad"&&r.text){
          const pool=poolFor(row);
          /* מפצלים לפי מפרידים נפוצים בטופס ומתאימים כל חלק בנפרד */
          String(r.text).split(/[;•·\n]|,(?=\s*[א-ת])/).map(x=>x.trim()).filter(x=>x.length>2)
            .forEach(part=>{
              let m=null;
              const sk=Object.keys(SLANG)
                .filter(k=>part.includes(k)&&k.length/part.length>=.6)
                .sort((a,b)=>b.length-a.length)[0];
              if(sk)m={p:["slang",sk]};
              if(!m)m=matchDiag(part,pool);
              if(!m){ if(!ALLPOOL)ALLPOOL=allTerms(); m=matchDiag(part,ALLPOOL,1.6); }
              if(m)rec.diag.push([m.p[0],m.p[1],part]);
              else{rest.push(part);SCAN.unmatched.push({n:row.n,name:row.t,text:part})}
            });
        }
        rec.rest=rest.join(" ; ");
        S.f.rows[r.n]=rec;
        SCAN.rowsRead.push({n:row.n,name:row.t,st:rec.st,raw:r.text||"",hit:rec.diag.length});
      });
      saveF();st[3]="ok";paint();
    }

  }catch(e){
    prog('<div class="note warn">'+T("err")+esc(e.message)+'<br>'+T("scFail")+'</div>');
  }finally{btn.disabled=false}
};

        const ic=c.ok===true?'<span class="chip ok">✓</span>':c.ok===false?
          '<span class="chip '+(c.lv==="bad"?"bad":c.lv==="warn"?"warn":"info")+'">≠</span>':'<span class="chip">—</span>';
        h+='<div class="kv"><span>'+ic+' '+esc(c.lb)+'</span><b>'+
           (c.ok===false?'<span style="color:var(--text2)">'+esc(c.lic)+'</span> ↔ '+esc(c.mot):esc(c.mot||c.lic))+'</b></div>';
      });
      h+='</div>';
      bad.forEach(c=>{h+='<div class="note '+(c.lv==="bad"?"bad":"warn")+'" style="font-size:12.5px"><b>'+
        esc(c.lb)+'</b> — '+esc(c.why)+'</div>'});
    }
    if(SCAN.lic.engine_no)h+='<div class="disc">'+T("rvEng")+'</div>';
  }
  /* מה נקרא מהטופס */
  if(SCAN.rowsRead.length){
    const bad=SCAN.rowsRead.filter(r=>r.st==="bad");
    h+='<div class="sect-lbl">'+T("rvForm")+'</div>'+
       '<div class="note info">'+T("rvCheck")+'</div><div class="card tight">';
    SCAN.rowsRead.forEach(r=>{
      h+='<div class="kv"><span>'+r.n+'. '+esc(r.name)+'</span><b>'+
        (r.st==="bad"?'<span class="chip bad">'+T("fmBad")+'</span>':
         r.st==="ok"?'<span class="chip ok">'+T("fmOk")+'</span>':'<span class="chip">'+T("fmNo")+'</span>')+'</b></div>'+
        (r.raw?'<div class="disc" style="margin:-4px 0 8px">'+esc(r.raw)+'</div>':"");
    });
    h+='</div>';
    if(SCAN.unmatched.length){
      h+='<div class="note warn"><b>'+T("rvUnm").replace("%n",SCAN.unmatched.length)+'</b><br>'+
        SCAN.unmatched.map(u=>"· "+esc(u.text)).join("<br>")+'</div>';
    }
  }
  h+='<div class="note bad" style="margin-top:14px">'+T("rvWarn")+'</div>';
  B.innerHTML=h;
}
document.getElementById("rv-go").onclick=()=>{nav("res");renderResult()};
document.getElementById("rv-edit").onclick=()=>nav("form");

/* ---------- מוכנות לסריקה ---------- */
function scanReady(){
  const ok=S.ai.provider&&VISION_OK.indexOf(S.ai.provider)>=0;
  const n=document.getElementById("sc-need");
  n.style.display=ok?"none":"block";
  n.innerHTML=T("needVision")+' <a href="#" onclick="nav(\'ai\');return false">→ '+T("b4")+'</a>';
  document.getElementById("sc-go").disabled=!ok;
  drawThumbs("lic");drawThumbs("frm");
}

/* ---------- מחירון של המשתמש ---------- */
document.getElementById("st-pr").onclick=()=>document.getElementById("st-prfile").click();
document.getElementById("st-prfile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    if(typeof j!=="object"||Array.isArray(j))throw new Error("format");
    store.set("prices",j);toast(T("done")+" · "+Object.keys(j).length);
  }catch(err){toast(T("err")+err.message)}};
  r.readAsText(f);
};
/* ---------------- boot ---------------- */
applyTheme();applyLang();updateLed();
if(S.ok)nav("home");else nav("gate");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
